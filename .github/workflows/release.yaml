name: Release Images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to release (all if empty)'
        required: false
        type: choice
        options:
        - all
        - config-server
        - eureka-server
        - spring-boot-admin
        - uaa-server
        default: all

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ${{ vars.DOCKER_REGISTRY }}

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [config-server, eureka-server, spring-boot-admin, uaa-server]

    steps:
    - uses: actions/checkout@v4

    - name: Filter Matrix
      id: filter
      run: |
        if [[ "${{ inputs.image }}" != "" && "${{ inputs.image }}" != "all" && "${{ inputs.image }}" != "${{ matrix.image }}" ]]; then
          echo "skip=true" >> $GITHUB_OUTPUT
        else
          echo "skip=false" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Login to container registry
      if: steps.filter.outputs.skip != 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ vars.DOCKER_REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push
      if: steps.filter.outputs.skip != 'true'
      run: |
        $Version  = Get-Content "${{ matrix.image }}/metadata/IMAGE_VERSION"
        $Revision = (Get-Content "${{ matrix.image }}/metadata/IMAGE_REVISION" -ErrorAction SilentlyContinue | ForEach-Object { $_.Trim() }) -join ""

        # When IMAGE_REVISION is set, the exact tag includes the suffix (e.g. 4.3.1-2).
        # The floating aliases (major.minor, major, latest) always track the highest revision.
        $VersionTag  = if ($Revision) { "$Version-$Revision" } else { $Version }
        $MajorMinor  = $Version.Split('.')[0..1] -join '.'
        $Major       = $Version.Split('.')[0]

        ./build.ps1 -Name '${{ matrix.image }}' -Registry '${{ env.REGISTRY }}' -Tag $VersionTag

        $FullImage = "${{ env.REGISTRY }}/${{ matrix.image }}"
        docker tag "${FullImage}:${VersionTag}" "${FullImage}:${MajorMinor}"
        docker tag "${FullImage}:${VersionTag}" "${FullImage}:${Major}"
        docker tag "${FullImage}:${VersionTag}" "${FullImage}:latest"

        docker push "${FullImage}:${VersionTag}"
        docker push "${FullImage}:${MajorMinor}"
        docker push "${FullImage}:${Major}"
        docker push "${FullImage}:latest"

      shell: pwsh
