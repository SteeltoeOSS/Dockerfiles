name: Release Images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to release (all if empty)'
        required: false
        type: choice
        options:
        - all
        - config-server
        - eureka-server
        - spring-boot-admin
        - uaa-server
        default: all

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ${{ vars.DOCKER_REGISTRY }}

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [config-server, eureka-server, spring-boot-admin, uaa-server]

    steps:
    - uses: actions/checkout@v4

    - name: Filter Matrix
      id: filter
      run: |
        if [[ "${{ inputs.image }}" != "" && "${{ inputs.image }}" != "all" && "${{ inputs.image }}" != "${{ matrix.image }}" ]]; then
          echo "skip=true" >> $GITHUB_OUTPUT
        else
          echo "skip=false" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Login to container registry
      if: steps.filter.outputs.skip != 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ vars.DOCKER_REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push
      if: steps.filter.outputs.skip != 'true'
      run: |
        $Version = Get-Content "${{ matrix.image }}/metadata/IMAGE_VERSION"
        $MajorMinor = $Version.Split('.')[0..1] -join '.'
        $Major = $Version.Split('.')[0]

        # Build with the exact version tag so we control what name is used
        ./build.ps1 -Name '${{ matrix.image }}' -Registry '${{ env.REGISTRY }}' -Tag $Version

        # Tag and push all version aliases
        $FullImage = "${{ env.REGISTRY }}/${{ matrix.image }}"
        docker tag "${FullImage}:${Version}" "${FullImage}:${MajorMinor}"
        docker tag "${FullImage}:${Version}" "${FullImage}:${Major}"
        docker tag "${FullImage}:${Version}" "${FullImage}:latest"

        docker push "${FullImage}:${Version}"
        docker push "${FullImage}:${MajorMinor}"
        docker push "${FullImage}:${Major}"
        docker push "${FullImage}:latest"

        # Push additional tags from metadata if any
        if (Test-Path "${{ matrix.image }}/metadata/ADDITIONAL_TAGS") {
             $AdditionalTags = Get-Content "${{ matrix.image }}/metadata/ADDITIONAL_TAGS"
             foreach ($tag in $AdditionalTags.Split(" ", [System.StringSplitOptions]::RemoveEmptyEntries)) {
                 $FullTag = $tag.Replace("${{ matrix.image }}", "${{ env.REGISTRY }}/${{ matrix.image }}")
                 docker push $FullTag
             }
        }

      shell: pwsh
