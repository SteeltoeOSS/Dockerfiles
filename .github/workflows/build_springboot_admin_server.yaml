name: Build Spring Boot Admin Server

on:
  pull_request:
    paths:
    - '.github/workflows/build_springboot_admin_server.yaml'
    - '.github/workflows/build-image.yaml'
    - 'spring-boot-admin/metadata/*'
    - 'spring-boot-admin/patches/*'
    - 'spring-boot-admin/customizations/**'
    - 'spring-boot-admin/source/**'
    - 'build.ps1'
  push:
    branches:
    - main
    paths:
    - '.github/workflows/build_springboot_admin_server.yaml'
    - '.github/workflows/build-image.yaml'
    - 'spring-boot-admin/metadata/*'
    - 'spring-boot-admin/patches/*'
    - 'spring-boot-admin/customizations/**'
    - 'spring-boot-admin/source/**'
    - 'build.ps1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    uses: ./.github/workflows/build-image.yaml
    with:
      image: spring-boot-admin
      description: Spring Boot Admin Server
    secrets: inherit
